<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>3M 调试台</title>
  <style>
    :root { --bg: #0f1419; --card: #1a2332; --border: #2d3a4d; --text: #e7ecf3; --muted: #8b9cb3; --accent: #3d8bfd; --ok: #3dd68c; --err: #f87171; }
    * { box-sizing: border-box; }
    body { font-family: "Segoe UI", system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 1.5rem; line-height: 1.5; }
    h1 { font-size: 1.25rem; font-weight: 600; margin: 0 0 0.25rem; }
    .sub { color: var(--muted); font-size: 0.875rem; margin-bottom: 1.5rem; }
    section { background: var(--card); border: 1px solid var(--border); border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1rem; }
    section h2 { font-size: 0.95rem; margin: 0 0 0.75rem; color: var(--accent); }
    label { display: block; font-size: 0.75rem; color: var(--muted); margin: 0.5rem 0 0.25rem; }
    input, textarea { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); border-radius: 6px; padding: 0.5rem 0.65rem; font-family: ui-monospace, monospace; font-size: 0.8rem; }
    textarea { min-height: 4rem; resize: vertical; }
    button { margin-top: 0.75rem; background: var(--accent); color: #fff; border: none; border-radius: 6px; padding: 0.5rem 1rem; font-size: 0.875rem; cursor: pointer; }
    button:hover { filter: brightness(1.1); }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    pre.out { background: var(--bg); border: 1px solid var(--border); border-radius: 6px; padding: 0.75rem; margin: 0.75rem 0 0; font-size: 0.75rem; overflow: auto; max-height: 16rem; white-space: pre-wrap; word-break: break-all; }
    pre.out.err { border-color: var(--err); color: var(--err); }
    pre.out.ok { border-color: var(--ok); }
    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.75rem; }
    @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <h1>MCPManagerMCP（3M）调试台</h1>
  <p class="sub">直接调用 list_managed_mcps · add_managed_mcp · execute_step（与 MCP 工具同引擎）</p>

  <section id="sec-list">
    <h2>list_managed_mcps</h2>
    <label>correlation_id（可选）</label>
    <input id="list-corr" type="text" placeholder="" />
    <button type="button" data-action="list">调用 list</button>
    <pre class="out" id="out-list"></pre>
  </section>

  <section id="sec-add">
    <h2>add_managed_mcp</h2>
    <label>requirement（必需：能力 + 基本配置）</label>
    <textarea id="add-req" placeholder="sqlite MCP，数据库文件 C:\data\app.db&#10;或：文件系统 MCP，允许目录 C:\DATA\GODATA\AgentTest\WorkSpace">sqlite MCP，数据库文件 C:\data\app.db</textarea>
    <div class="row">
      <div>
        <label>constraints（可选：补充配置，如 token、只读）</label>
        <input id="add-con" type="text" placeholder="GITHUB_TOKEN=... 或 只读" />
      </div>
      <div>
        <label>correlation_id（可选）</label>
        <input id="add-corr" type="text" />
      </div>
    </div>
    <button type="button" data-action="add">调用 add</button>
    <pre class="out" id="out-add"></pre>
  </section>

  <section id="sec-exec">
    <h2>execute_step</h2>
    <label>mcp_id（必需）</label>
    <input id="exec-mcp" type="text" placeholder="add 返回的 mcp_id" />
    <label>step_goal（必需）</label>
    <input id="exec-goal" type="text" value="echo" />
    <label>rawdata（必需，JSON 或纯文本）</label>
    <textarea id="exec-raw">{"input":"hello-3m"}</textarea>
    <label>correlation_id（可选）</label>
    <input id="exec-corr" type="text" />
    <button type="button" data-action="execute">调用 execute</button>
    <pre class="out" id="out-exec"></pre>
  </section>

  <script>
    async function call(path, body) {
      const r = await fetch(path, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(body || {}),
      });
      const text = await r.text();
      let parsed;
      try { parsed = JSON.parse(text); } catch { parsed = text; }
      if (!r.ok) {
        const err = typeof parsed === "object" ? parsed.error || JSON.stringify(parsed) : parsed;
        throw new Error(err || r.statusText);
      }
      return parsed;
    }

    function show(id, data, ok) {
      const el = document.getElementById(id);
      el.textContent = typeof data === "string" ? data : JSON.stringify(data, null, 2);
      el.className = "out " + (ok ? "ok" : "err");
    }

    document.querySelectorAll("button[data-action]").forEach((btn) => {
      btn.addEventListener("click", async () => {
        const action = btn.dataset.action;
        const outId = "out-" + (action === "execute" ? "exec" : action);
        btn.disabled = true;
        try {
          let result;
          if (action === "list") {
            result = await call("/api/list", {
              correlation_id: document.getElementById("list-corr").value.trim(),
            });
          } else if (action === "add") {
            result = await call("/api/add", {
              requirement: document.getElementById("add-req").value,
              constraints: document.getElementById("add-con").value.trim(),
              correlation_id: document.getElementById("add-corr").value.trim(),
            });
            if (result.mcp_id) {
              document.getElementById("exec-mcp").value = result.mcp_id;
            }
          } else {
            result = await call("/api/execute", {
              mcp_id: document.getElementById("exec-mcp").value.trim(),
              step_goal: document.getElementById("exec-goal").value.trim(),
              rawdata: document.getElementById("exec-raw").value,
              correlation_id: document.getElementById("exec-corr").value.trim(),
            });
          }
          show(outId, result, true);
        } catch (e) {
          show(outId, e.message || String(e), false);
        } finally {
          btn.disabled = false;
        }
      });
    });
  </script>
</body>
</html>
